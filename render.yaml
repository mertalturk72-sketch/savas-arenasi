# Render.com için hazır yapılandırma (ücretsiz plan).
# Depoyu Render'a bağlayınca bu dosyayı görüp sunucuyu kendiliğinden kurar.
#
# Ücretsiz planda servis 15 dakika boş kalınca uyur; ilk giren oyuncu
# ~1 dakika bekler, sonra herkese açık ve hızlıdır.

services:
  - type: web
    name: savas-arenasi
    runtime: node
    plan: free
    region: frankfurt          # Türkiye'ye en yakın bölge
    # Sunucunun ÇALIŞMASI için dış paket gerekmiyor (WebSocket dahil her şey
    # depoda). Kurulumda sadece iki şey üretiliyor:
    #   www/        → tarayıcıya giden dosyalar
    #   dist/paket.zip → uygulamanın kendini güncellerken indirdiği paket
    buildCommand: node scripts/build-www.mjs && node scripts/make-bundle.mjs
    startCommand: node server/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
