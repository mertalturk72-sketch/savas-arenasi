<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lobi Kart Testi — LPC + silah</title>
<style>
  html,body{margin:0;background:#12161d;color:#e8eef6;font-family:system-ui,Segoe UI,Arial,sans-serif}
  h1{font-size:18px;text-align:center;padding:12px 0 2px;margin:0}
  .sub{text-align:center;color:#8fa0b4;font-size:12px;margin-bottom:10px}
  .grid{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;padding:12px}
  .card{background:#1b212b;border:1px solid #2b3442;border-radius:12px;padding:8px;text-align:center;width:120px}
  .name{font-weight:700;font-size:13px;margin-top:4px}
  canvas{image-rendering:pixelated;background:#0e1218;border-radius:8px;width:96px;height:108px}
  .wep{color:#7c8ba0;font-size:11px}
  #err{color:#ff8a8a;text-align:center;white-space:pre-wrap;font-size:12px}
</style>
</head>
<body>
<h1>Lobi Kartı Testi — gerçek sprites.js (LPC) + silah bindirmesi</h1>
<div class="sub">her karakter kendi sınıf silahıyla · lobideki çizimin birebir aynısı</div>
<div id="err"></div>
<div class="grid" id="grid"></div>

<script type="module">
import { getCharacterSprites, drawWeaponOnPreview, preloadSprites, spritesReady } from './js/sprites.js';
import { CHARACTERS, CLASSES, WEAPONS } from '/shared/constants.js';

const err = document.getElementById('err');
const grid = document.getElementById('grid');
const weaponIds = Object.values(CLASSES).map(c => c.weapon);

(async () => {
  await preloadSprites();
  err.textContent = spritesReady() ? '' : 'UYARI: LPC yüklenemedi, prosedürel yedek gösteriliyor.';
  const chars = Object.values(CHARACTERS);
  chars.forEach((ch, i) => {
    const weaponId = weaponIds[i % weaponIds.length];
    const card = document.createElement('div'); card.className = 'card';
    const cv = document.createElement('canvas'); cv.width = 64; cv.height = 72;
    const cx = cv.getContext('2d'); cx.imageSmoothingEnabled = false;
    const set = getCharacterSprites({ jacket: ch.jacket, hair: ch.hair, skin: ch.skin, accent: ch.accent, eye: ch.eye, style: ch.style });
    cx.drawImage(set.down.stand || set.down[0], 0, 0, 64, 72);
    drawWeaponOnPreview(cx, 0, 0, 2, weaponId, ch.skin, ch.jacket);
    const name = document.createElement('div'); name.className = 'name'; name.textContent = ch.name;
    const wep = document.createElement('div'); wep.className = 'wep'; wep.textContent = WEAPONS[weaponId]?.name || weaponId;
    card.appendChild(cv); card.appendChild(name); card.appendChild(wep);
    grid.appendChild(card);
  });
})().catch(e => err.textContent = 'HATA: ' + (e && e.message || e));
</script>
</body>
</html>
